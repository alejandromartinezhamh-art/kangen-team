<!doctype html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=DM+Serif+Display:ital@1&display=swap" rel="stylesheet">
<style>
  /* CRM de leads del embudo: tablero horizontal, una columna por etapa. Claro y cálido, sin sombras. */
  :root {
    --fondo: #f3ebdf; --columna: #ebe0d1; --tarjeta: #fffaf3; --borde: #dccdb9;
    --tinta: #100904; --texto: #382416; --suave: #6c5f51; --acento: #b84300; --acento-fondo: #fbe3d3;
    --ok: #2f6b2a; --ok-fondo: #e1efd9; --error: #b3261e;
    --font: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button, input, select, textarea { font: inherit; color: inherit; }

  header { padding: 18px 20px 0; }
  .barra { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; padding-bottom: 14px; border-bottom: 1px dashed var(--borde); }
  .barra a { color: var(--suave); text-decoration: none; }
  .titulo { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 22px 0 18px; }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; line-height: .92; letter-spacing: -0.045em; }
  h1 em { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; letter-spacing: -0.02em; }
  .kpis { display: flex; gap: 8px; flex-wrap: wrap; }
  .kpi { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px; padding: 8px 14px; min-width: 96px; }
  .kpi b { display: block; font-size: 22px; letter-spacing: -0.04em; }
  .kpi span { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--suave); }
  @media (max-width: 560px) { .kpis { display: grid; grid-template-columns: 1fr 1fr; width: 100%; } }
  .buscar { width: min(420px, 100%); border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 14px; padding: 10px 14px; font-size: 15px; outline: none; }
  .buscar:focus { border-color: var(--tinta); }
  .buscar::placeholder { color: var(--suave); }

  /* Tablero */
  .tablero { display: flex; gap: 12px; overflow-x: auto; padding: 16px 20px 28px; align-items: flex-start; min-height: calc(100vh - 190px); scroll-snap-type: x proximity; }
  .columna { flex: 0 0 262px; background: var(--columna); border-radius: 20px; padding: 10px; scroll-snap-align: start; display: flex; flex-direction: column; max-height: calc(100vh - 220px); }
  .columna.encima { outline: 2px dashed var(--acento); outline-offset: -2px; }
  .columna.descartado { opacity: .75; }
  .col-cabeza { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 8px 10px; }
  .col-nombre { font-size: 13px; font-weight: 700; text-transform: uppercase; }
  .col-nombre small { display: block; font-size: 10px; font-weight: 600; color: var(--suave); text-transform: none; margin-top: 2px; }
  .col-n { font-size: 12px; font-weight: 700; color: var(--suave); background: var(--tarjeta); border-radius: 999px; padding: 2px 9px; }
  .tarjetas { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 60px; padding-bottom: 4px; }
  .vacia { font-size: 12px; color: var(--suave); text-align: center; padding: 18px 8px; border: 1px dashed var(--borde); border-radius: 14px; }

  .lead { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px; padding: 12px 12px 10px; cursor: grab; }
  .lead:active { cursor: grabbing; }
  .lead.arrastrando { opacity: .4; }
  .lead.destacado { border-color: var(--acento); }
  .cabeza { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .nombre { font-size: 16px; font-weight: 700; letter-spacing: -0.03em; }
  .cuando { flex: none; font-size: 10px; font-weight: 600; color: var(--suave); text-transform: uppercase; }
  .contacto { margin-top: 3px; font-size: 12px; color: var(--suave); word-break: break-all; line-height: 1.45; }
  .contacto a { text-decoration: none; }
  .senales { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .senal { font-size: 10px; font-weight: 700; text-transform: uppercase; border-radius: 999px; padding: 3px 8px; background: var(--columna); color: var(--suave); }
  .senal.si { background: var(--ok-fondo); color: var(--ok); }
  .senal.acento { background: var(--acento-fondo); color: var(--acento); }
  .senal.espera { background: transparent; border: 1px dashed var(--borde); }
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
  .boton { display: flex; align-items: center; justify-content: center; min-height: 34px; border-radius: 36px; font-size: 11px; font-weight: 700; text-transform: uppercase; text-decoration: none; border: 1px solid var(--tinta); background: transparent; }
  .boton.lleno { background: var(--tinta); color: var(--tarjeta); }
  .mover { grid-column: 1 / -1; width: 100%; min-height: 34px; border-radius: 12px; border: 1px solid var(--borde); background: var(--tarjeta); padding: 0 10px; font-size: 12px; font-weight: 600; }

  details { margin-top: 8px; border-top: 1px dashed var(--borde); padding-top: 6px; }
  summary { cursor: pointer; font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--suave); list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: ' +'; }
  details[open] summary::after { content: ' −'; }
  dl { margin: 6px 0 0; font-size: 12px; }
  dt { color: var(--suave); margin-top: 6px; }
  dd { margin: 1px 0 0; font-weight: 600; }
  textarea { width: 100%; min-height: 64px; margin-top: 8px; border: 1px solid var(--borde); background: #fff; border-radius: 12px; padding: 8px 10px; font-size: 13px; resize: vertical; outline: none; }
  textarea:focus { border-color: var(--tinta); }
  .guardado { font-size: 10px; color: var(--suave); min-height: 13px; margin-top: 2px; }

  .aviso { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--tinta); color: var(--tarjeta); border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .aviso.ver { opacity: 1; }
  .aviso.mal { background: var(--error); }
  .cargando { padding: 40px 20px; color: var(--suave); font-weight: 500; }
  .acceso { max-width: 360px; margin: 12vh auto 0; padding: 0 20px; display: grid; gap: 12px; }
  .acceso h2 { margin: 0; font-size: 28px; letter-spacing: -0.04em; }
  .acceso p { margin: 0; color: var(--suave); font-size: 14px; }
  .acceso input { border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 14px; padding: 12px 14px; font-size: 16px; outline: none; }
  .acceso input:focus { border-color: var(--tinta); }
  .acceso button { min-height: 46px; border: 0; border-radius: 36px; background: var(--tinta); color: var(--tarjeta); font-size: 13px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
  .acceso .error { color: var(--error); font-weight: 600; min-height: 1.2em; }
  .salir { background: none; border: 0; padding: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--suave); cursor: pointer; }
  a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px dashed var(--tinta); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <div class="barra"><span>Leads del webinar</span><span><a id="enlace-hoja" href="#" target="_blank" rel="noopener">Abrir hoja ↗</a> · <button type="button" class="salir" id="salir">Salir</button></span></div>
  <div class="titulo">
    <h1>Tus <em>leads</em></h1>
    <div class="kpis" id="kpis"></div>
  </div>
  <input class="buscar" id="buscar" type="search" placeholder="Buscar por nombre, email o teléfono" autocomplete="off">
</header>
<main class="tablero" id="tablero"><p class="cargando">Cargando leads…</p></main>
<form class="acceso" id="acceso" hidden>
  <h2>Tus leads</h2>
  <p>Escribe tu clave del CRM. Este navegador la recordará.</p>
  <input type="password" id="clave" autocomplete="current-password" placeholder="Clave" required>
  <button type="submit">Entrar</button>
  <p class="error" id="error-acceso"></p>
</form>
<div class="aviso" id="aviso"></div>

<script>
  // Clave del CRM: viene en el enlace (?crm=) o se pide una vez y se guarda en este navegador.
  var CLAVE = <?!= JSON.stringify(clave) ?>;
  var GUARDADA = 'crm_clave';
  function leerGuardada() { try { return localStorage.getItem(GUARDADA) || ''; } catch (e) { return ''; } }
  function guardarClave(k) { try { k ? localStorage.setItem(GUARDADA, k) : localStorage.removeItem(GUARDADA); } catch (e) {} }
  if (CLAVE) guardarClave(CLAVE); else CLAVE = leerGuardada();
  var datos = { leads: [], estados: [], horasRecordatorio: 24 };
  var texto = '';
  var arrastrado = null;

  // Explicación bajo el nombre de algunas columnas
  var AYUDA = { 'Vio el vídeo': 'Vio el webinar, aún sin WhatsApp', 'Recontactado': 'Recordatorio enviado o le has escrito' };

  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function dia(iso) { var d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); }
  function hace(iso) {
    var d = new Date(iso); if (isNaN(d)) return '';
    var min = Math.round((Date.now() - d) / 60000);
    if (min < 1) return 'ahora';
    if (min < 60) return 'hace ' + min + ' min';
    var h = Math.round(min / 60);
    if (h < 24) return 'hace ' + h + ' h';
    var dd = Math.round(h / 24);
    return dd < 7 ? 'hace ' + dd + ' d' : dia(iso);
  }
  function telefono(t) {
    var n = String(t || '').replace(/\D/g, '');
    if (n.length === 9 && /^[6789]/.test(n)) n = '34' + n; // número español sin prefijo
    return n;
  }
  function primerNombre(n) { return String(n || '').trim().split(/\s+/)[0] || ''; }
  function aviso(msg, mal) {
    var a = $('aviso'); a.textContent = msg; a.className = 'aviso ver' + (mal ? ' mal' : '');
    clearTimeout(aviso.t); aviso.t = setTimeout(function () { a.className = 'aviso'; }, 2200);
  }

  function senales(l) {
    var s = [];
    if (l.visto) s.push('<span class="senal si">Vídeo visto · ' + dia(l.visto) + '</span>');
    else if (l.abierto) s.push('<span class="senal si">Vídeo abierto · ' + dia(l.abierto) + '</span>');
    else s.push('<span class="senal">Vídeo sin abrir</span>');
    if (l.recordatorio) s.push('<span class="senal">Recordatorio · ' + dia(l.recordatorio) + '</span>');
    else if (!l.abierto && !l.visto && l.emailWebinar) {
      var faltan = Math.ceil((new Date(l.emailWebinar).getTime() + datos.horasRecordatorio * 3600000 - Date.now()) / 3600000);
      s.push('<span class="senal espera">' + (faltan > 0 ? 'Recordatorio en ' + faltan + ' h' : 'Recordatorio en cola') + '</span>');
    }
    if (l.pulsado) s.push('<span class="senal acento">Pulsó WhatsApp · ' + dia(l.pulsado) + '</span>');
    return s.join('');
  }

  function tarjeta(l) {
    var tel = telefono(l.telefono);
    var yo = primerNombre(datos.yo);
    var mensaje = 'Hola ' + primerNombre(l.nombre) + (yo ? ', soy ' + yo : '') + '. Te escribo porque rellenaste el cuestionario del webinar.';
    var opciones = datos.estados.map(function (e) { return '<option' + (e === l.estado ? ' selected' : '') + '>' + esc(e) + '</option>'; }).join('');
    var respuestas = Object.keys(l.respuestas).map(function (p) { return '<dt>' + esc(p) + '</dt><dd>' + esc(l.respuestas[p]) + '</dd>'; }).join('');
    // Ha dado señales (vídeo visto o WhatsApp) y sigue en las primeras columnas: no dejarlo escapar
    var destacado = (l.visto || l.pulsado) && datos.estados.indexOf(l.estado) <= datos.estados.indexOf('WhatsApp');
    return '<article class="lead' + (destacado ? ' destacado' : '') + '" draggable="true" data-id="' + esc(l.id) + '">' +
      '<div class="cabeza"><span class="nombre">' + esc(l.nombre || 'Sin nombre') + '</span><span class="cuando">' + esc(hace(l.fecha)) + '</span></div>' +
      '<div class="contacto">' +
        (tel ? '<a href="tel:+' + tel + '">+' + esc(tel) + '</a><br>' : '') +
        (l.email ? '<a href="mailto:' + esc(l.email) + '">' + esc(l.email) + '</a>' : '') +
        (l.instagram ? '<br><a target="_blank" rel="noopener" href="https://instagram.com/' + encodeURIComponent(l.instagram.replace(/^@/, '')) + '">' + esc(l.instagram) + '</a>' : '') +
      '</div>' +
      '<div class="senales">' + senales(l) + '</div>' +
      '<div class="acciones">' +
        (tel ? '<a class="boton lleno" target="_blank" rel="noopener" href="https://wa.me/' + tel + '?text=' + encodeURIComponent(mensaje) + '">WhatsApp</a>' : '<span></span>') +
        (l.email ? '<a class="boton" href="mailto:' + esc(l.email) + '">Email</a>' : '<span></span>') +
        '<select class="mover" aria-label="Mover a">' + opciones + '</select>' +
      '</div>' +
      '<details><summary>Respuestas y notas</summary>' +
        (respuestas ? '<dl>' + respuestas + '</dl>' : '') +
        '<textarea class="notas" placeholder="Notas: qué habéis hablado, próximos pasos…">' + esc(l.notas) + '</textarea>' +
        '<div class="guardado"></div>' +
      '</details>' +
    '</article>';
  }

  function coincide(l) {
    if (!texto) return true;
    return (l.nombre + ' ' + l.email + ' ' + l.telefono + ' ' + l.instagram).toLowerCase().indexOf(texto.toLowerCase()) !== -1;
  }

  function pintar() {
    var L = datos.leads;
    var n = function (f) { return L.filter(f).length; };
    var desde = function (e) { var i = datos.estados.indexOf(e); return function (l) { var j = datos.estados.indexOf(l.estado); return j >= i && l.estado !== 'Descartado'; }; };
    $('kpis').innerHTML = [
      ['Leads', L.length],
      ['Vieron el vídeo', n(function (l) { return l.visto; })],
      ['En WhatsApp o más', n(desde('WhatsApp'))],
      ['Compras', n(desde('Compra'))]
    ].map(function (k) { return '<div class="kpi"><b>' + k[1] + '</b><span>' + k[0] + '</span></div>'; }).join('');

    var abiertos = {};
    document.querySelectorAll('.lead details[open]').forEach(function (d) { abiertos[d.closest('.lead').getAttribute('data-id')] = true; });
    var scroll = $('tablero').scrollLeft;

    $('tablero').innerHTML = datos.estados.map(function (e) {
      var suyos = L.filter(function (l) { return l.estado === e && coincide(l); });
      return '<section class="columna' + (e === 'Descartado' ? ' descartado' : '') + '" data-estado="' + esc(e) + '">' +
        '<div class="col-cabeza"><span class="col-nombre">' + esc(e) + (AYUDA[e] ? '<small>' + esc(AYUDA[e]) + '</small>' : '') + '</span>' +
        '<span class="col-n">' + suyos.length + '</span></div>' +
        '<div class="tarjetas">' + (suyos.length ? suyos.map(tarjeta).join('') : '<div class="vacia">Arrastra aquí</div>') + '</div>' +
      '</section>';
    }).join('');

    Object.keys(abiertos).forEach(function (id) {
      var d = document.querySelector('.lead[data-id="' + id + '"] details'); if (d) d.open = true;
    });
    $('tablero').scrollLeft = scroll;
  }

  function lead(id) { return datos.leads.filter(function (l) { return l.id === id; })[0]; }

  function guardar(id, campo, valor, alAcabar) {
    google.script.run
      .withSuccessHandler(function () { alAcabar && alAcabar(true); })
      .withFailureHandler(function (e) { aviso('No se ha guardado: ' + e.message, true); alAcabar && alAcabar(false); })
      .crmGuardar(CLAVE, id, campo, valor);
  }

  function mover(id, estado) {
    var l = lead(id); if (!l || l.estado === estado) return;
    var antes = l.estado; l.estado = estado; pintar();
    guardar(id, 'Estado', estado, function (ok) {
      if (ok) aviso(primerNombre(l.nombre) + ' → ' + estado);
      else { l.estado = antes; pintar(); }
    });
  }

  function pedirClave(mensaje) {
    document.querySelector('header').hidden = true; $('tablero').hidden = true;
    $('acceso').hidden = false; $('error-acceso').textContent = mensaje || ''; $('clave').focus();
  }

  function cargar() {
    if (!CLAVE) return pedirClave();
    google.script.run
      .withSuccessHandler(function (d) {
        guardarClave(CLAVE); datos = d; $('enlace-hoja').href = d.hoja;
        document.querySelector('header').hidden = false; $('tablero').hidden = false; $('acceso').hidden = true;
        pintar();
      })
      .withFailureHandler(function (e) {
        if (/clave/i.test(e.message)) { CLAVE = ''; guardarClave(''); return pedirClave('Esa clave no es correcta.'); }
        $('tablero').innerHTML = '<p class="cargando">No se han podido cargar los leads: ' + esc(e.message) + '</p>';
      })
      .crmDatos(CLAVE);
  }

  $('acceso').addEventListener('submit', function (e) {
    e.preventDefault(); CLAVE = $('clave').value.trim(); $('error-acceso').textContent = 'Comprobando…'; cargar();
  });
  $('salir').addEventListener('click', function () { CLAVE = ''; guardarClave(''); datos.leads = []; pedirClave(); });

  // Arrastrar tarjetas entre columnas (ordenador); en el móvil, el desplegable "Mover a"
  var tablero = $('tablero');
  tablero.addEventListener('dragstart', function (e) {
    var art = e.target.closest && e.target.closest('.lead'); if (!art) return;
    arrastrado = art.getAttribute('data-id'); art.classList.add('arrastrando');
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', arrastrado);
  });
  tablero.addEventListener('dragend', function () {
    arrastrado = null;
    document.querySelectorAll('.arrastrando, .encima').forEach(function (el) { el.classList.remove('arrastrando', 'encima'); });
  });
  tablero.addEventListener('dragover', function (e) {
    var col = e.target.closest && e.target.closest('.columna'); if (!col || !arrastrado) return;
    e.preventDefault();
    document.querySelectorAll('.encima').forEach(function (el) { if (el !== col) el.classList.remove('encima'); });
    col.classList.add('encima');
  });
  tablero.addEventListener('drop', function (e) {
    var col = e.target.closest && e.target.closest('.columna'); if (!col || !arrastrado) return;
    e.preventDefault(); mover(arrastrado, col.getAttribute('data-estado'));
  });
  tablero.addEventListener('change', function (e) {
    if (!e.target.classList.contains('mover')) return;
    mover(e.target.closest('.lead').getAttribute('data-id'), e.target.value);
  });
  // Las notas se guardan solas al dejar de escribir
  tablero.addEventListener('input', function (e) {
    if (!e.target.classList.contains('notas')) return;
    var art = e.target.closest('.lead'); var l = lead(art.getAttribute('data-id'));
    var marca = art.querySelector('.guardado'); marca.textContent = 'Escribiendo…';
    l.notas = e.target.value;
    clearTimeout(e.target.t);
    e.target.t = setTimeout(function () {
      guardar(l.id, 'Notas', l.notas, function (ok) { marca.textContent = ok ? 'Guardado' : 'Sin guardar'; });
    }, 800);
  });
  $('buscar').addEventListener('input', function (e) { texto = e.target.value.trim(); pintar(); });

  cargar();
  setInterval(function () { if (CLAVE && !document.hidden && !arrastrado && !document.querySelector('textarea:focus')) cargar(); }, 60000);
</script>
</body>
</html>
