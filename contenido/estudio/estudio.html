<script>
(() => {
'use strict';
/*@COMPOSICIONES@*/
/*@MONTAJE_VIDEO@*/

// ================================================================ Utilidades
const $ = (s, r = document) => r.querySelector(s);

const r2 = (n) => Math.round(n * 100) / 100;

const lectura = (t) => r2(Math.max(2, 0.7 + palabrasDe(t) / 3));
const seg = (n) => `${String(r2(n)).replace('.', ',')} s`;
const reloj = (n) => { n = Math.max(0, n || 0); return `${Math.floor(n / 60)}:${String(Math.floor(n % 60)).padStart(2, '0')}`; };

const escapar = (t) => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  for (const el of t.content.querySelectorAll('*')) {

// ================================================================ Caras (las mismas cuentas que scripts/encuadre.mjs)
const area = (r) => Math.max(0, r.r - r.l) * Math.max(0, r.b - r.t);
const corte = (a, b) => ({ l: Math.max(a.l, b.l), t: Math.max(a.t, b.t), r: Math.min(a.r, b.r), b: Math.min(a.b, b.b) });
const caja = (d) => ({ l: d.left, t: d.top, r: d.right, b: d.bottom });
function letrasDe(sec) {
  const cajas = [];
  const recorrido = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT);
  for (let n = recorrido.nextNode(); n; n = recorrido.nextNode()) {
    if (!n.textContent.trim()) continue;
    const e = getComputedStyle(n.parentElement);
    if (e.visibility === 'hidden' || e.display === 'none' || parseFloat(e.opacity) < 0.1) continue;
    const rango = document.createRange();
    rango.selectNodeContents(n);
    for (const r of rango.getClientRects()) if (r.width > 0.5 && r.height > 0.5) cajas.push(caja(r));
  }
  for (const b of sec.querySelectorAll('.boton')) cajas.push(caja(b.getBoundingClientRect()));
  return cajas;
}
function posicion(img) {
  const [x = '50%', y = '50%'] = getComputedStyle(img).objectPosition.split(' ');
  const fr = (v) => (v.endsWith('%') ? parseFloat(v) / 100 : 0.5);
  return { x: fr(x), y: fr(y) };
}
function geometria(img, sec, letras) {
  if (!img.naturalWidth) return null;
  const doc = E.fotos.get(img.dataset.foto);
  const k = sec.getBoundingClientRect().width / 1080;
  const est = getComputedStyle(img);
  const r = img.getBoundingClientRect();
  const px = (v) => (parseFloat(v) || 0) * k;
  const hueco = {
    l: r.left + px(est.borderLeftWidth) + px(est.paddingLeft), t: r.top + px(est.borderTopWidth) + px(est.paddingTop),
    r: r.right - px(est.borderRightWidth) - px(est.paddingRight), b: r.bottom - px(est.borderBottomWidth) - px(est.paddingBottom),
  };
  let visible = { ...hueco };
  for (let n = img.parentElement; n; n = n.parentElement) {
    if (getComputedStyle(n).overflow !== 'visible') visible = corte(visible, caja(n.getBoundingClientRect()));
    if (n === sec) break;
  }
  if (px(est.borderTopLeftRadius) >= (hueco.r - hueco.l) * 0.4) {
    const mx = (visible.r - visible.l) * 0.15, my = (visible.b - visible.t) * 0.15;
    visible = { l: visible.l + mx, t: visible.t + my, r: visible.r - mx, b: visible.b - my };
  }
  const ancho = hueco.r - hueco.l, alto = hueco.b - hueco.t;
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const cover = est.objectFit === 'cover';
  const escala = cover ? Math.max(ancho / nw, alto / nh) : Math.min(ancho / nw, alto / nh);
  const sobraX = ancho - nw * escala, sobraY = alto - nh * escala;
  const f = doc?.ancho ? nw / doc.ancho : 1;
  const caras = Array.isArray(doc?.caras) ? doc.caras.map((c) => ({ l: c.l * f, t: c.t * f, r: c.r * f, b: c.b * f })) : null;
  const enImagen = (x, y) => (caras || []).map((c) => ({
    l: hueco.l + sobraX * x + c.l * escala, t: hueco.t + sobraY * y + c.t * escala,
    r: hueco.l + sobraX * x + c.r * escala, b: hueco.t + sobraY * y + c.b * escala,
  }));
  const medir = (x, y) => {
    let fuera = 0, tapada = 0;
    for (const c of enImagen(x, y)) {
      const total = area(c) || 1;
      fuera = Math.max(fuera, 1 - area(corte(c, visible)) / total);
      const cubierta = (letras || []).reduce((s, l) => s + area(corte(corte(c, visible), l)), 0);
      tapada = Math.max(tapada, Math.min(1, cubierta / total));
    }
    return { fuera, tapada };
  };
  return { caras, cover, sobraX, sobraY, girada: est.transform !== 'none', enImagen, medir };
}
function revisarFoto(img, sec, letras, holgura = 0) {
  if (!img.dataset.foto) return { problemas: ['Foto de ejemplo: cámbiala por una suya.'], cajas: [] };
  const doc = E.fotos.get(img.dataset.foto);
  if (!doc) return { problemas: ['Esta foto ya no está en la galería.'], cajas: [] };
  if (!Array.isArray(doc.caras)) return { problemas: [], info: 'Caras sin comprobar: lo miro yo al generarlo.', cajas: [] };
  const g = geometria(img, sec, letras);
  if (!g || !g.caras.length) return { problemas: [], cajas: [], sinCaras: true };
  const p = posicion(img);
  const m = g.medir(p.x, p.y);
  const tolerancia = (g.girada ? 0.08 : 0.03) + holgura;
  const problemas = [];
  if (m.fuera > tolerancia) problemas.push(`Cara cortada (se pierde el ${Math.round(m.fuera * 100)} %)`);
  if (m.tapada > tolerancia) problemas.push(`Texto encima de la cara (${Math.round(m.tapada * 100)} %)`);
  return { problemas, cajas: g.enImagen(p.x, p.y) };
}
// Coloca la foto para que las caras queden enteras y sin texto encima, lo más cerca posible de donde estaba.
function encuadrar(img, sec) {
  const g = geometria(img, sec, letrasDe(sec));
  if (!g || !g.caras?.length || !g.cover) return false;
  const actual = posicion(img);
  const pasos = (sobra, eje) => (Math.abs(sobra) < 1 ? [eje] : Array.from({ length: 41 }, (_, i) => i / 40));
  let mejor = actual, menor = Infinity;
  for (const x of pasos(g.sobraX, actual.x)) {
    for (const y of pasos(g.sobraY, actual.y)) {
      const m = g.medir(x, y);
      const coste = 100 * m.fuera + 40 * m.tapada + Math.hypot(x - actual.x, y - actual.y);
      if (coste < menor) { menor = coste; mejor = { x, y }; }
    }
  }
  img.style.objectPosition = `${(mejor.x * 100).toFixed(1)}% ${(mejor.y * 100).toFixed(1)}%`;
  delete img.dataset.encuadre;
  return true;
}

// ================================================================ Detector de caras para las fotos que se suben aquí
let detector;
function cargarDetector() {
  detector ??= new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js';
    s.onload = ok;
    s.onerror = mal;
    document.head.append(s);
  }).then(async () => {
    await window.faceapi.nets.ssdMobilenetv1.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model/');
    return window.faceapi;
  });
  return detector;
}
async function detectarCaras(lienzo) {
  const fa = await Promise.race([cargarDetector(), new Promise((_, mal) => setTimeout(() => mal(new Error('tiempo')), 30000))]);
  const k = Math.min(1, 900 / Math.max(lienzo.width, lienzo.height));
  const peq = h('canvas', { width: Math.round(lienzo.width * k), height: Math.round(lienzo.height * k) });
  peq.getContext('2d').drawImage(lienzo, 0, 0, peq.width, peq.height);
  const halladas = await fa.detectAllFaces(peq, new fa.SsdMobilenetv1Options({ minConfidence: 0.45 }));
  const todas = halladas.map(({ box }) => ({
    l: Math.round((box.x - box.width * 0.15) / k), t: Math.round((box.y - box.height * 0.4) / k),
    r: Math.round((box.x + box.width * 1.15) / k), b: Math.round((box.y + box.height * 1.12) / k),
  }));
  const mayor = Math.max(0, ...todas.map((c) => c.r - c.l));
  return todas.filter((c) => c.r - c.l >= mayor * 0.4);
}

  for (const f of archivos) {
    const progreso = $('#progreso-subida');
    if (progreso) progreso.textContent = `Subiendo ${f.name}…`;
    try {
      if (f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic)$/i.test(f.name)) await subirFoto(f);
      else if (f.type.startsWith('video/') || /\.(mov|mp4|m4v|webm)$/i.test(f.name)) await subirClip(f);
      else nota(`${f.name}: solo fotos y clips.`);

}
async function subirFoto(f) {
  let mapa;
  try { mapa = await createImageBitmap(f); } catch { throw new Error('no se puede abrir aquí (¿es HEIC?). Pásala a JPG o déjala en Drive y la subo yo.'); }
  // Como mucho 2000 px y en JPG: pesa poco y se queda sin los datos de la cámara (ni ubicación ni fecha).
  const k = Math.min(1, 2000 / Math.max(mapa.width, mapa.height));
  const lienzo = h('canvas', { width: Math.round(mapa.width * k), height: Math.round(mapa.height * k) });
  lienzo.getContext('2d').drawImage(mapa, 0, 0, lienzo.width, lienzo.height);
  const archivo = await new Promise((ok) => lienzo.toBlob(ok, 'image/jpeg', 0.88));
  const subida = await E.assets.upload(archivo, { type: 'image/jpeg' });
  let caras = null;
  try { caras = await detectarCaras(lienzo); } catch { caras = null; }
  await E.db.doc('fotos/' + subida.id).set({ nombre: f.name.replace(/\.[^.]+$/, ''), tipo: 'foto', ancho: lienzo.width, alto: lienzo.height, caras, subida: Date.now() });
}
const duracionMedio = (url, etiqueta = 'video') => new Promise((ok) => {
  const m = document.createElement(etiqueta);
  m.preload = 'metadata';
  m.onloadedmetadata = () => ok(Number.isFinite(m.duration) ? r2(m.duration) : null);
  m.onerror = () => ok(null);
  m.src = url;
  setTimeout(() => ok(null), 15000);
});
async function subirClip(f) {
  if (f.size > 20 * 1024 * 1024) throw new Error('pesa más de 20 MB. Recórtalo en el móvil o déjalo en Drive y lo subo yo.');
  const tipo = /^video\/(mp4|webm|quicktime)$/.test(f.type) ? f.type : /\.webm$/i.test(f.name) ? 'video/webm' : /\.mov$/i.test(f.name) ? 'video/quicktime' : 'video/mp4';
  let subida;
  try { subida = await E.assets.upload(f, { type: tipo }); } catch (e) {
    if (e?.code !== 'unsupported_type' || tipo === 'video/mp4') throw e;
    subida = await E.assets.upload(f, { type: 'video/mp4' });
  }
  const duracion = await duracionMedio(subida.url);
  await E.db.doc('fotos/' + subida.id).set({ nombre: f.name.replace(/\.[^.]+$/, ''), tipo: 'video', duracion, subida: Date.now() });
}

function revisarImagen(sec, holgura = 0) {

  for (const img of sec.querySelectorAll('img')) {
    const r = revisarFoto(img, sec, letras, holgura);
    for (const p of r.problemas) avisos.push({ grave: true, texto: p });

  }
  const texto = textoDe(sec);
  const n = palabrasDe(texto);

function revisarCarrusel() {
  const avisos = [];
  if (E.pieza.formato === 'imagen') {
    if (E.minis.length > 1) avisos.push({ grave: false, texto: 'Una imagen suelta lleva una sola imagen: si son más, es un carrusel.' });
    return avisos;
  }
  const comps = E.minis.map(composicionDe);
  const n = comps.length;
  if (n && n < 3) avisos.push({ grave: false, texto: 'Un carrusel lleva al menos 3 imágenes.' });
  if (n > 10) avisos.push({ grave: false, texto: `${n} imágenes: ¿sobra alguna? (de 3 a 10)` });
  const distintas = new Set(comps).size;
  if (n >= 5 && distintas < 4) avisos.push({ grave: false, texto: `Solo ${distintas} composiciones distintas: usa al menos 4.` });
  comps.forEach((c, i) => { if (i && c === comps[i - 1]) avisos.push({ grave: false, texto: `Imágenes ${i} y ${i + 1}: la misma composición seguida.` }); });
  const porFoto = new Map();
  E.minis.forEach((sec, i) => $$('img[data-foto]', sec).forEach((img) => porFoto.set(img.dataset.foto, [...(porFoto.get(img.dataset.foto) || []), i + 1])));
  const minimo = E.pieza.estilo === 'tipografico' ? 1 : 3;
  if (n && porFoto.size < minimo) avisos.push({ grave: false, texto: `Solo ${porFoto.size} foto(s) suyas distintas: pon al menos ${minimo}.` });
  for (const [, imgs] of porFoto) if (imgs.length > 1) avisos.push({ grave: false, texto: `La misma foto en las imágenes ${imgs.join(' y ')}.` });
  // El estilo, distinto de los tres carruseles anteriores de la persona.
  const anteriores = [...E.piezas.values()].filter((p) => p.formato === 'carrusel' && p.dia != null && E.pieza.dia != null && p.dia < E.pieza.dia)
    .sort((a, b) => b.dia - a.dia).slice(0, 3);
  const igual = anteriores.find((p) => p.estilo === E.pieza.estilo);
  if (igual) avisos.push({ grave: false, texto: `El mismo estilo que el carrusel del día ${igual.dia}: cambia de estilo.` });
  return avisos;
}

function alPulsar(e) {
  if (!E.secActual || e.button > 0) return;
  const pila = document.elementsFromPoint(e.clientX, e.clientY).filter((el) => E.secActual.contains(el));
  for (const el of pila) {
    const editable = el.closest('[contenteditable]');
    if (editable) {
      const adorno = editable.closest(SEL_ADORNO);
      if (adorno) { if (E.elegido?.el !== adorno) elegir({ tipo: 'adorno', el: adorno }); } else if (E.elegido) elegir(null);
      return;
    }
    const adorno = el.closest(SEL_ADORNO);
    if (adorno) { e.preventDefault(); elegir({ tipo: 'adorno', el: adorno }); arrastrarAdorno(e, adorno); return; }
    if (el.tagName === 'IMG') { e.preventDefault(); document.activeElement?.blur?.(); elegir({ tipo: 'foto', el }); arrastrarFoto(e, el); return; }
  }
  if (E.elegido) elegir(null);
}
function seguir(e, mover, soltar) {
  const x0 = e.clientX, y0 = e.clientY;
  let movido = false;
  const alMover = (ev) => {
    const dx = ev.clientX - x0, dy = ev.clientY - y0;
    if (!movido && Math.hypot(dx, dy) < 3) return;
    if (!movido) guardarHistorial();
    movido = true;
    mover(dx, dy);
  };
  const alSoltar = () => {
    window.removeEventListener('pointermove', alMover);
    window.removeEventListener('pointerup', alSoltar);
    window.removeEventListener('pointercancel', alSoltar);
    if (movido) soltar();
  };
  window.addEventListener('pointermove', alMover);
  window.addEventListener('pointerup', alSoltar);
  window.addEventListener('pointercancel', alSoltar);
}
function arrastrarFoto(e, img) {
  const g = geometria(img, E.secActual, []);
  if (!g || !g.cover) return;
  const p0 = posicion(img);
  seguir(e, (dx, dy) => {
    const x = Math.abs(g.sobraX) > 1 ? clamp01(p0.x + dx / g.sobraX) : p0.x;

// Contraste entre dos colores (WCAG), para avisar de letras que no se leen.
function luz(hex) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;

const contraste = (a, b) => { const [x, y] = [luz(a), luz(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); };
function estilosRapidos() {

  return [
    { nombre: 'Limpio', estilo: { letra: '#ffffff', resalte: lila, enfasis: coral, fondo: '' } },
    { nombre: 'Caja oscura', estilo: { letra: '#ffffff', resalte: coral, enfasis: coral, fondo: '#000000' } },
    { nombre: 'Tu color', estilo: { letra: '#000000', resalte: acento, enfasis: acento, fondo: lila } },
    { nombre: 'Caja blanca', estilo: { letra: '#000000', resalte: estructura, enfasis: acento, fondo: '#ffffff' } },
  ].map((r) => ({ ...r, estilo: Object.fromEntries(Object.entries(r.estilo).map(([k, x]) => [k, String(x).toLowerCase()])) }));
}
function avisosLetras(e) {
  const avisos = [];
  const sobre = e.fondo || '#000000';
  if (!e.fondo && luz(e.letra) < 0.4) avisos.push('Las letras oscuras se pierden sobre el vídeo: ponles una caja clara.');
  if (e.fondo && contraste(e.letra, e.fondo) < 4.5) avisos.push('Las letras casi no se leen sobre esa caja: cambia el color de la letra o de la caja.');
  if (contraste(e.resalte, sobre) < 3) avisos.push('La palabra que se está diciendo no destaca: elige otro color para ella.');
  if (contraste(e.enfasis, sobre) < 3) avisos.push('La palabra en cursiva no se lee bien: elige otro color para ella.');
  return avisos;
}

// La voz: se guarda tal cual si es m4a/mp4 o webm; si no (opus, ogg, mp3, wav), se pasa a webm en el propio navegador.
async function subirVoz(f) {
  if (!E.assets) return nota('Solo quien puede editar el estudio puede subir la voz.');
  const progreso = $('#progreso-voz');
  try {
    let archivo = f, tipo = null, duracion = null;
    try {
      const ctx = new AudioContext();
      duracion = r2((await ctx.decodeAudioData(await f.arrayBuffer())).duration);
      ctx.close();
    } catch { duracion = null; }
    if (/\.(m4a|mp4)$/i.test(f.name) || /audio\/(mp4|x-m4a)|video\/mp4/.test(f.type)) tipo = 'video/mp4';
    else if (/\.webm$/i.test(f.name) || /webm/.test(f.type)) tipo = 'video/webm';
    else {
      archivo = await convertirVoz(f, (s, total) => { progreso.textContent = `Preparando tu voz… ${Math.round(s)} de ${Math.round(total)} s`; });
      tipo = archivo.type.includes('mp4') ? 'video/mp4' : 'video/webm';
    }
    if (archivo.size > 20 * 1024 * 1024) throw new Error('la nota de voz pesa más de 20 MB.');
    progreso.textContent = 'Subiendo tu voz…';
    const subida = await E.assets.upload(archivo, { type: tipo });
    duracion ??= await duracionMedio(subida.url, 'audio');
    guardarHistorial();
    E.pieza.video.voz = { asset: subida.id, nombre: f.name, duracion };
    progreso.textContent = '';
    cambioVideo({ panel: true });
    nota('Voz subida. El vídeo ahora dura lo que tu voz.');
  } catch (e) {
    progreso.textContent = '';
    nota('No se ha podido subir la voz: ' + mensajeError(e), 7000);
  }
}
async function convertirVoz(f, avisar) {
  const ctx = new AudioContext();
  await ctx.resume();
  const datos = await ctx.decodeAudioData(await f.arrayBuffer());
  const destino = ctx.createMediaStreamDestination();
  const fuente = ctx.createBufferSource();
  fuente.buffer = datos;
  fuente.connect(destino);
  const tipo = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find((t) => window.MediaRecorder?.isTypeSupported?.(t));
  if (!tipo) throw new Error('este navegador no puede preparar la voz: súbela en m4a (notas de voz del iPhone) o déjala en Drive.');
  const grabadora = new MediaRecorder(destino.stream, { mimeType: tipo });
  const trozos = [];
  grabadora.ondataavailable = (e) => e.data.size && trozos.push(e.data);
  const terminado = new Promise((ok) => { grabadora.onstop = ok; });
  grabadora.start(500);
  const inicio = ctx.currentTime;
  fuente.start();
  const marcha = setInterval(() => avisar(ctx.currentTime - inicio, datos.duration), 500);
  await new Promise((ok) => { fuente.onended = ok; });
  clearInterval(marcha);
  grabadora.stop();
  await terminado;
  ctx.close();
  return new Blob(trozos, { type: tipo.split(';')[0] });
}

// ================================================================ Piezas
function rellenarSelector() {
  const sel = $('#selector-pieza');
  const piezas = [...E.piezas.values()].sort((a, b) => (a.dia ?? 1e9) - (b.dia ?? 1e9) || String(a.codigo).localeCompare(b.codigo));
  const grupo = (formato, nombre) => {
    const lista = piezas.filter((p) => (p.formato || 'carrusel') === formato);
    return lista.length ? h('optgroup', { label: nombre }, lista.map((p) => h('option', { value: p.codigo, selected: p.codigo === E.actual },
      `${p.dia != null ? `Día ${p.dia} · ` : ''}${p.titulo || p.codigo}${p.estado && p.estado !== 'borrador' ? ` · ${ESTADOS[p.estado]}` : ''}`))) : null;
  };
  sel.replaceChildren(...[grupo('carrusel', 'Carruseles'), grupo('imagen', 'Imágenes sueltas'), grupo('video', 'Vídeos')].filter(Boolean));
  if (!piezas.length) sel.append(h('option', { value: '' }, 'Sin piezas todavía'));
  sel.value = E.actual || '';
}
function abrirPieza(codigo) {
  if (E.pieza && E.sucio) guardar();
  pararVideo();
  const datos = E.piezas.get(codigo);
  if (!datos) return;
  if (E.pieza?.codigo !== codigo) E.sel = 0;
  E.actual = codigo;
  guardarLocal('estudio:pieza', codigo);
  E.pieza = structuredClone(datos);
  E.pieza.codigo = codigo;
  E.pieza.slides ??= [];
  E.pieza.estilo ??= 'album';
  E.sel = Math.min(E.sel, Math.max(0, E.pieza.slides.length - 1));
  E.secActual = null;
  E.elegido = null;
  E.historial = [];
  R.t = 0;
  R.plano = 0;
  pintarPieza();
}
function pintarPieza() {
  if (!E.pieza) return;

  else pintarCarrusel();
}
function nuevaPieza() {

      const codigo = 'N-' + Date.now().toString(36);
      const datos = { codigo, titulo: titulo.value.trim() || 'Sin título', formato, dia: dia.value ? Number(dia.value) : null, estilo: 'album', slides: [],
        video: formato === 'video' ? { gancho: '', voz: null, medios: [] } : null, nota: '', estado: 'borrador', creada: Date.now(), actualizado: Date.now() };

// ================================================================ Arranque
async function arrancar() {
  $('#btn-nueva').addEventListener('click', () => (E.db ? nuevaPieza() : nota('Abre el estudio desde Claude para crear piezas.')));
  $('#selector-pieza').addEventListener('change', (e) => e.target.value && abrirPieza(e.target.value));
  const vista = $('#vista');
  vista.addEventListener('pointerdown', (e) => { if (e.target.closest('#escenario')) alPulsar(e); });
  vista.addEventListener('input', (e) => { const ed = e.target.closest?.('#escenario [contenteditable]'); if (ed) despuesDeEscribir(ed); });
  vista.addEventListener('focusin', (e) => { if (e.target.closest?.('#escenario [contenteditable]')) guardarHistorial(); });
  vista.addEventListener('keydown', (e) => {
    if (!e.target.closest?.('#escenario [contenteditable]')) return;
    if (e.key === 'Enter') { e.preventDefault(); document.execCommand('insertLineBreak'); }
  });
  vista.addEventListener('paste', (e) => {
    if (!e.target.closest?.('#escenario [contenteditable]')) return;
    e.preventDefault();
    document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
  });
  document.addEventListener('keydown', (e) => {
    const escribiendo = e.target.closest?.('[contenteditable], input, textarea, select');
    if (escribiendo) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && E.elegido?.tipo === 'adorno') { guardarHistorial(); E.elegido.el.remove(); elegir(null); despuesDeCambiar(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); deshacer(); }
  });
  let temporizadorTamaño;
  window.addEventListener('resize', () => {
    clearTimeout(temporizadorTamaño);
    temporizadorTamaño = setTimeout(() => {
      if (!E.pieza) return;
      if (E.pieza.formato === 'video') { const sigue = R.play; pararVideo(); montarPantalla(); if (sigue) verVideo(); } else { capturar(); pintarEscenario(); }
    }, 200);
  });
  window.addEventListener('pagehide', () => { if (E.sucio) guardar(); });

  const [db, assets] = await Promise.all([usar('db'), usar('assets')]);
  E.db = db;
  E.assets = assets;
  if (!db) {
    vista.replaceChildren(h('div', { class: 'vacio' }, h('h2', null, 'El estudio necesita tu cuenta de Claude'),
      h('p', null, 'Ábrelo desde Claude con la sesión iniciada para ver y guardar las piezas.')));
    return;
  }
  let llegaron = false;
  const espera = setTimeout(() => { if (!llegaron) marcarGuardado('Las piezas tardan en llegar; puede que no estén al día.', true); }, 10000);
  const error = (e) => { clearTimeout(espera); marcarGuardado('Sin conexión con el estudio: ' + mensajeError(e), true); };
  db.doc('ajustes/persona').onSnapshot((s) => {
    const d = s.exists ? s.data() : {};
    E.ajustes = { nombre: d.nombre || 'Nombre', clave: d.clave || '', colores: d.colores || {} };
    $('#quien').textContent = d.nombre ? `de ${d.nombre}` : 'de contenido';
    document.title = d.nombre ? `Estudio de ${d.nombre}` : 'Estudio de contenido';
  }, error);
  db.collection('fotos').onSnapshot((s) => {
    E.fotos = new Map(s.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
    $$('.gal').forEach((g) => g.refrescar?.());
  }, error);
  db.collection('piezas').onSnapshot((s) => {
    llegaron = true;
    clearTimeout(espera);
    E.piezas = new Map(s.docs.map((d) => [d.id, { ...d.data(), codigo: d.id }]));
    if (!s.metadata.fromCache && !E.sucio) marcarGuardado('');
    if (E.actual && !E.piezas.has(E.actual) && !s.metadata.fromCache) { E.actual = null; E.pieza = null; }
    if (!E.actual || !E.piezas.has(E.actual)) E.actual = [...E.piezas.values()].sort((a, b) => (a.dia ?? 1e9) - (b.dia ?? 1e9))[0]?.codigo || null;
    rellenarSelector();
    if (!E.actual) {
      vista.replaceChildren(h('div', { class: 'vacio' }, h('h2', null, 'Aún no hay piezas'), h('p', null, 'Crea una con «Nueva pieza» o pídele a Claude que prepare las de la semana.')));
      return;
    }
    const remota = E.piezas.get(E.actual);
    const editando = document.activeElement?.closest?.('#vista [contenteditable], #vista input, #vista textarea');
    if (!E.pieza || E.pieza.codigo !== E.actual) abrirPieza(E.actual);
    else if (!E.sucio && !editando && remota.actualizado !== E.miUltimo && remota.actualizado !== E.pieza.actualizado) abrirPieza(E.actual);
  }, error);
}
arrancar();
})();
